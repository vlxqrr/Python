<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    
</head>
<body>
    <form action="post">
        <input type="number" name="height" id="height" placeholder="Enter your height">
        <input type="number" name="weight" id="weight" placeholder="Enter your weight">
        <input type="button" value="count" placeholder="Calculate BMI" onclick="CalculateBMI()">
        <p id="result"></p>
    </form>
    <script src="script.js"></script>
    
</body>
</html>
